## DEFAULT SETTINGS ARE NOT MEANT TO BE TAKEN STRAIGHT INTO PRODUCTION
## see https://www.rabbitmq.com/docs/configure for further information
## on configuring RabbitMQ

## allow access to the guest user from anywhere on the network
## https://www.rabbitmq.com/docs/access-control#loopback-users
## https://www.rabbitmq.com/docs/production-checklist#users
loopback_users.guest = false

## Send all logs to stdout/TTY. Necessary to see logs when running via
## a container
log.console = true

## 24h: video conversion in the node worker can take longer than the default 30 min,
## after which RabbitMQ would close the channel and redeliver the job
## https://www.rabbitmq.com/docs/consumers#acknowledgement-timeout
consumer_timeout = 86400000
